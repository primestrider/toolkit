name: Build & Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          # DO NOT set cache: pnpm here

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Fallback install pnpm if missing
        run: |
          if ! command -v pnpm &> /dev/null
          then
            echo "pnpm not found, installing globally..."
            npm install -g pnpm@10
          else
            echo "pnpm is available"
          fi

      # Optional: cache pnpm store to speed up installs (uncomment if desired)
      - name: Cache pnpm store (optional)
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies (skip optional native deps)
        run: pnpm install --frozen-lockfile --no-optional

      - name: Build Nuxt (SSG)
        run: pnpm run build

      - name: Install Vercel CLI
        run: pnpm add -g vercel@35

      - name: Deploy to Vercel (prebuilt)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # optional, but helpful to avoid interactive lookup:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || '' }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || '' }}
        run: vercel --prebuilt --prod --confirm --token "$VERCEL_TOKEN"
