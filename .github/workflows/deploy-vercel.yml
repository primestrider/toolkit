name: Build & Deploy to Vercel

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      # 🟢 FIX: fallback install pnpm jika belum terdeteksi
      - name: Fallback install pnpm if missing
        run: |
          if ! command -v pnpm &> /dev/null
          then
            echo "pnpm not found, installing globally..."
            npm install -g pnpm@10
          else
            echo "pnpm is available"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Nuxt (SSG)
        run: pnpm run build

      - name: Install Vercel CLI
        run: pnpm add -g vercel@35

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel --prebuilt --prod --confirm --token "$VERCEL_TOKEN"
