name: Build & Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Fallback install pnpm if missing
        run: |
          if ! command -v pnpm &> /dev/null
          then
            echo "pnpm not found, installing globally..."
            npm install -g pnpm@10
          else
            echo "pnpm is available"
          fi

      - name: Verify env (debug)
        run: |
          echo "PATH=$PATH"
          node -v
          npm -v
          if command -v pnpm; then echo "pnpm: $(pnpm -v)"; else echo "pnpm: not found"; fi
          echo "Listing top-level files:"
          ls -la

      # Optional: disable cache for debugging; re-enable later if OK.
      #- name: Cache pnpm store
      #  uses: actions/cache@v4
      #  with:
      #    path: ~/.pnpm-store
      #    key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
      #    restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies (skip optional + ignore scripts)
        run: pnpm install --frozen-lockfile --no-optional --ignore-scripts

      - name: Run nuxt prepare manually
        run: pnpm dlx nuxt prepare || npx nuxt prepare || pnpm run prepare

      - name: Build Nuxt (SSG)
        run: pnpm run build

      - name: Install Vercel CLI (fallback)
        run: |
          if ! command -v vercel &> /dev/null; then
            pnpm add -g vercel@35 || npm install -g vercel@35
          fi
          vercel --version

      # Prefer using action for robustness
      - name: Deploy to Vercel (action, reliable)
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          prod: true
